name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          unzip CustomGameplayWorldDynamics-Forge-1.20.1.zip -d temp_zip
          # Move files from nested folder if present
          if [ -d temp_zip/CustomGameplayWorldDynamics-Forge-1.20.1 ]; then
            cp -r temp_zip/CustomGameplayWorldDynamics-Forge-1.20.1/* .
          else
            cp -r temp_zip/* .
          fi
          rm -rf temp_zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/*.jar
