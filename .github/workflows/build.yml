name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP Dynamically
        run: |
          unzip *.zip -d temp_zip
          PROJECT_DIR=$(find temp_zip -name "build.gradle" -exec dirname {} \;)
          if [ -n "$PROJECT_DIR" ]; then
            shopt -s dotglob
            cp -r "$PROJECT_DIR"/* .
            shopt -u dotglob
            echo "تم استخراج ونقل ملفات المشروع بنجاح"
          else
            echo "خطأ: لم يتم العثور على ملف build.gradle داخل ملف الـ ZIP"
            exit 1
          fi
          rm -rf temp_zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/*.jar
