name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          unzip -o *.zip -d project_extracted
          # البحث عن مكان build.gradle والانتقال إليه
          BUILD_FILE=$(find project_extracted -name "build.gradle" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            DIR_PATH=$(dirname "$BUILD_FILE")
            echo "Project directory found at: $DIR_PATH"
            cp -r "$DIR_PATH"/* .
          fi
          rm -rf project_extracted

      - name: Build with Installed Gradle
        run: gradle build --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/*.jar
