name: Build Minecraft Bedrock Addon

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Bedrock Addon Structure
        run: |
          echo "📂 جاري إنتاج بنية حزمة Bedrock Add-on..."
          
          # إنشاء مجلدات الباكج (Behavior Pack و Resource Pack)
          mkdir -p bedrock_addon/behavior_pack/entities
          mkdir -p bedrock_addon/resource_pack/entity
          mkdir -p bedrock_addon/resource_pack/textures/entity

          # 1. ملف مانفست حزمة السلوك (Behavior Pack Manifest)
          cat << 'EOF' > bedrock_addon/behavior_pack/manifest.json
          {
            "format_version": 2,
            "header": {
              "description": "Custom Gameplay World Dynamics Behavior Pack",
              "name": "CustomGameplay BP",
              "uuid": "$(uuidgen)",
              "version": [1, 0, 0],
              "min_engine_version": [1, 20, 0]
            },
            "modules": [
              {
                "description": "Behavior Module",
                "type": "data",
                "uuid": "$(uuidgen)",
                "version": [1, 0, 0]
              }
            ]
          }
          EOF

          # 2. ملف مانفست حزمة الموارد (Resource Pack Manifest)
          cat << 'EOF' > bedrock_addon/resource_pack/manifest.json
          {
            "format_version": 2,
            "header": {
              "description": "Custom Gameplay World Dynamics Resource Pack",
              "name": "CustomGameplay RP",
              "uuid": "$(uuidgen)",
              "version": [1, 0, 0],
              "min_engine_version": [1, 20, 0]
            },
            "modules": [
              {
                "description": "Resource Module",
                "type": "resources",
                "uuid": "$(uuidgen)",
                "version": [1, 0, 0]
              }
            ]
          }
          EOF

          # 3. إعداد الكائن (Bandit Entity) لنسخة البيدروك
          cat << 'EOF' > bedrock_addon/behavior_pack/entities/bandit.json
          {
            "format_version": "1.20.0",
            "minecraft:entity": {
              "description": {
                "identifier": "custom:bandit",
                "is_spawnable": true,
                "is_summonable": true,
                "is_experimental": false
              },
              "components": {
                "minecraft:health": {
                  "value": 20,
                  "max": 20
                },
                "minecraft:movement": {
                  "value": 0.25
                },
                "minecraft:attack": {
                  "damage": 3
                },
                "minecraft:type_family": {
                  "family": ["bandit", "monster"]
                }
              }
            }
          }
          EOF

          # البحث عن أي صور أو أيقونات مضافة مسبقاً ووضعها في الموارد
          find . -name "bandit.png" -exec cp {} bedrock_addon/resource_pack/textures/entity/ \; || true

          # ضغط المجلدات بصيغة .mcaddon
          cd bedrock_addon
          zip -r ../customgameplayworlddynamics.mcaddon *
          cd ..
          
          mkdir -p build/libs
          mv customgameplayworlddynamics.mcaddon build/libs/
          echo "✅ تم إنشاء الـ Addon بنجاح!"

      - name: Upload Addon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-bedrock-addon
          path: build/libs/*.mcaddon
