name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract All Files and Flatten Structure
        run: |
          echo "=== الملفات الموجودة في الجذر ==="
          ls -la
          
          # فك ضغط جميع ملفات الـ ZIP الموجودة في المستودع
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "جاري فك ضغط: $zipfile"
              unzip -o "$zipfile" -d extracted_temp
            fi
          done
          
          # نقل جميع الملفات والمجلدات إلى الجذر الرئيسي للمستودع
          if [ -d "extracted_temp" ]; then
            BUILD_PATH=$(find extracted_temp -name "build.gradle" -exec dirname {} \; | head -n 1)
            if [ -n "$BUILD_PATH" ]; then
              echo "تم العثور على مجلد المشروع في: $BUILD_PATH"
              shopt -s dotglob
              cp -r "$BUILD_PATH"/* .
              shopt -u dotglob
            else
              cp -r extracted_temp/* .
            fi
            rm -rf extracted_temp
          fi
          
          echo "=== الملفات بعد الفك والتنظيم ==="
          ls -la

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "تم منح صلاحيات التنفيذ لـ gradlew بنجاح"
          else
            echo "تحذير: لم يتم العثور على gradlew"
          fi

      - name: Build with Project Gradle Wrapper
        run: ./gradlew build --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/*.jar
