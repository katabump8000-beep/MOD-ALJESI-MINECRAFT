name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Extract Project ZIP
        run: |
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              unzip -o "$zipfile" -d extracted_temp
            fi
          done
          
          if [ -d "extracted_temp" ]; then
            BUILD_PATH=$(find extracted_temp -name "build.gradle" -exec dirname {} \; | head -n 1)
            if [ -n "$BUILD_PATH" ]; then
              shopt -s dotglob
              cp -r "$BUILD_PATH"/* .
              shopt -u dotglob
            else
              cp -r extracted_temp/* .
            fi
            rm -rf extracted_temp
          fi

      - name: Fix Forge Repository Conflict
        run: |
          # إصلاح تعارض المستودعات الخاص بـ Forge في ملف settings.gradle
          if [ -f "settings.gradle" ]; then
            sed -i '/FAIL_ON_PROJECT_REPOS/d' settings.gradle
            sed -i 's/repositoriesMode.set.*/repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)/g' settings.gradle || true
            echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_PROJECT) }" >> settings.gradle || true
          fi

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build --no-daemon -Dorg.gradle.zoneinfo=UTC
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/*.jar
