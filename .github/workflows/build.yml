name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Extract ZIP Project
        run: |
          echo "📦 محتويات الـ repo قبل الفك:"
          ls -la
          
          # ابحث عن أي ملف zip في الجذر
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ما لقيت ملف zip!"
            exit 1
          fi
          
          echo "📂 عم أفك: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d _project
          
          # ابحث عن build.gradle داخل المجلد المستخرج
          BUILD_FILE=$(find _project -name "build.gradle" -type f | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "❌ ما لقيت build.gradle داخل الـ zip!"
            echo "المحتويات:"
            find _project -type f | head -50
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "📁 مجلد المشروع: $PROJECT_DIR"
          
          # انقل كل الملفات (بما فيها المخفية) للجذر
          shopt -s dotglob
          mv "$PROJECT_DIR"/* .
          shopt -u dotglob
          rm -rf _project
          
          # احذف الـ zip الأصلي (مش ضروري بس نظافة)
          rm -f "$ZIP_FILE"
          
          echo "✅ تم الفك بنجاح. محتويات الجذر:"
          ls -la

      - name: Fix Forge settings.gradle (if needed)
        run: |
          if [ -f "settings.gradle" ]; then
            # إصلاح بسيط: استبدل FAIL_ON_PROJECT_REPOS فقط
            sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle
            echo "settings.gradle بعد التعديل:"
            cat settings.gradle
          fi

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: warn
