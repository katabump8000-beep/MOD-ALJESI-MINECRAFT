name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Extract ZIP Project
        run: |
          echo "📦 محتويات الـ repo قبل الفك:"
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ما لقيت ملف zip!"
            exit 1
          fi
          
          echo "📂 عم أفك: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d _project
          
          BUILD_FILE=$(find _project -name "build.gradle" -type f | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "❌ ما لقيت build.gradle داخل الـ zip!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "📁 مجلد المشروع: $PROJECT_DIR"
          
          shopt -s dotglob
          cp -r "$PROJECT_DIR"/* .
          shopt -u dotglob
          rm -rf _project
          rm -f "$ZIP_FILE"
          
          echo "✅ تم الفك بنجاح."

      - name: Fix Forge settings.gradle
        run: |
          if [ -f "settings.gradle" ]; then
            sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle
          fi

      - name: Auto-Fix Missing Imports in BanditEntity
        run: |
          # البحث التلقائي عن ملف BanditEntity.java وإضافة الاستيرادات الناقصة
          TARGET_FILE=$(find . -name "BanditEntity.java" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            echo "🔧 تم العثور على الملف وجاري إصلاح الـ Imports: $TARGET_FILE"
            sed -i '/package /a import net.minecraft.world.entity.ai.goal.target.HurtByTargetGoal;\nimport net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal;' "$TARGET_FILE"
          else
            echo "⚠️ تنبيه: لم يتم العثور على الملف، سيتم متابعة البناء بشكل طبيعي."
          fi

      - name: Ensure Gradle Wrapper and Build
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚙️ توليد ملف gradlew..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/*.jar
          if-no-files-found: warn
