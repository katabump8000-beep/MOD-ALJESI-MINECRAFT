plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.jes'
version = '1.0.0'
base { archivesName = 'customgameplayworlddynamics' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { customgameplay { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: '1.20.1', forge_version: '47.4.10',
                             mod_id: 'customgameplay', mod_name: 'Custom Gameplay & World Dynamics',
                             mod_version: project.version, mod_authors: 'J.E.S', mod_description: 'Gameplay, world decoration and bandit systems.']
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
